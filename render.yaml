# Blueprint Render untuk backend SIMONDA (Django Ninja). Terapkan lewat
# dashboard Render -> New -> Blueprint, arahkan ke repo ini.
#
# Variabel dengan `sync: false` sengaja TIDAK diisi di sini (supaya secret
# tidak ikut ter-commit ke git) -- isi manual di dashboard Render setelah
# Blueprint diterapkan. Lihat README bagian "Deploy gratis" untuk nilai apa
# yang harus diisi dan dari mana asalnya.
services:
  - type: web
    name: simonda-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn simonda.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CSRF_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
